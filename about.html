    <style>
        /* Midnight Glass Design System - v1.0 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --bg-hover: #222233;
            --text-primary: #f0e6d3;
            --text-secondary: #a8a0a0;
            --text-muted: #6b6363;
            --accent-gold: #c9a96e;
            --accent-gold-light: #e8d5a3;
            --accent-glow: rgba(201, 169, 110, 0.15);
            --border-color: #2a2a3a;
            --border-light: #3a3a4a;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --max-width: 1200px;
            --header-height: 70px;
        }
        
        /* Reset & Base */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Typography */
        h1, h2, h3, h4 {
            font-family: 'Playfair Display', 'Noto Sans KR', serif;
            font-weight: 600;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }
        
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        h2 {
            font-size: clamp(1.5rem, 3.5vw, 2.2rem);
            margin-bottom: 1.5rem;
            color: var(--accent-gold-light);
        }
        
        h3 {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            margin-bottom: 0.8rem;
            color: var(--text-primary);
        }
        
        p {
            margin-bottom: 1.2rem;
            color: var(--text-secondary);
            font-weight: 300;
            font-size: 1.05rem;
        }
        
        /* Drop caps for first paragraph after heading */
        .drop-cap::first-letter {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em;
            float: left;
            line-height: 0.8;
            margin-right: 0.5rem;
            margin-top: 0.15rem;
            color: var(--accent-gold);
            font-weight: 700;
            text-shadow: 0 2px 10px var(--accent-glow);
        }
        
        /* Links */
        a {
            color: var(--accent-gold);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
        }
        
        a:hover {
            color: var(--accent-gold-light);
            text-shadow: 0 0 20px var(--accent-glow);
        }
        
        /* Layout */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            transition: var(--transition);
        }
        
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-gold-light);
            text-decoration: none;
            letter-spacing: 0.1em;
        }
        
        .logo span {
            color: var(--text-primary);
        }
        
        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        nav a {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.5rem 0;
            position: relative;
        }
        
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent-gold);
            transition: var(--transition);
        }
        
        nav a:hover::after {
            width: 100%;
        }
        
        nav a.active {
            color: var(--accent-gold);
        }
        
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
            background: none;
            border: none;
        }
        
        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--text-primary);
            transition: var(--transition);
        }
        
        /* Hero Section */
        .hero {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, var(--accent-glow) 0%, transparent 50%);
            animation: heroGlow 8s ease-in-out infinite alternate;
        }
        
        @keyframes heroGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-10%, -10%); }
        }
        
        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
        }
        
        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
            font-weight: 300;
        }
        
        .hero p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2rem;
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0;
            transition: var(--transition);
        }
        
        .card:hover {
            border-color: var(--border-light);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        .card-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, transparent 60%);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }
        
        .card:hover .card-glow {
            opacity: 1;
        }
        
        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 4rem 0;
        }
        
        /* Detail Section */
        .detail-section {
            padding: 4rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .detail-section:last-child {
            border-bottom: none;
        }
        
        .detail-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* List styling */
        .info-list {
            list-style: none;
            padding: 0;
        }
        
        .info-list li {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }
        
        .info-list li:last-child {
            border-bottom: none;
        }
        
        .info-list .label {
            min-width: 120px;
            color: var(--accent-gold);
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .info-list .value {
            color: var(--text-secondary);
            flex: 1;
        }
        
        /* Price Card */
        .price-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2rem;
            text-align: center;
            transition: var(--transition);
        }
        
        .price-card.featured {
            border-color: var(--accent-gold);
            position: relative;
        }
        
        .price-card.featured::before {
            content: 'BEST';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gold);
            color: var(--bg-primary);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            padding: 4px 16px;
            border-radius: 20px;
        }
        
        .price-card .price {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-gold-light);
            margin: 1rem 0;
        }
        
        .price-card .price span {
            font-size: 1rem;
            color: var(--text-muted);
        }
        
        .price-card .duration {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        
        .price-card .description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        /* FAQ */
        .faq-item {
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 0;
        }
        
        .faq-item:last-child {
            border-bottom: none;
        }
        
        .faq-question {
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
        }
        
        .faq-question::after {
            content: '+';
            font-size: 1.5rem;
            color: var(--accent-gold);
            transition: var(--transition);
        }
        
        .faq-item.active .faq-question::after {
            transform: rotate(45deg);
        }
        
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            color: var(--text-secondary);
            padding-top: 0;
        }
        
        .faq-item.active .faq-answer {
            max-height: 300px;
            padding-top: 1rem;
        }
        
        /* CTA */
        .cta-section {
            text-align: center;
            padding: 4rem 0;
            background: linear-gradient(180deg, transparent, var(--bg-secondary));
        }
        
        .cta-button {
            display: inline-block;
            padding: 1rem 3rem;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            color: var(--bg-primary);
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            letter-spacing: 0.05em;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
            color: var(--bg-primary);
        }
        
        .tel-link {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-gold-light);
            text-decoration: none;
            display: inline-block;
            margin: 1rem 0;
            transition: var(--transition);
        }
        
        .tel-link:hover {
            color: var(--accent-gold);
            transform: scale(1.02);
        }
        
        /* Footer */
        footer {
            padding: 3rem 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
        
        footer p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            
            nav {
                position: fixed;
                top: var(--header-height);
                left: 0;
                right: 0;
                background: rgba(10, 10, 15, 0.98);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                transform: translateY(-100%);
                opacity: 0;
                transition: var(--transition);
                border-bottom: 1px solid var(--border-color);
            }
            
            nav.active {
                transform: translateY(0);
                opacity: 1;
            }
            
            nav a {
                font-size: 1rem;
            }
</body>
</html>
